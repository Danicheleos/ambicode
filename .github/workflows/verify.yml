name: verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Only a Windows checkout can diverge from the LF normalization.
      - name: line endings are normalized
        if: runner.os == 'Windows'
        shell: cmd
        run: node tools/check-line-endings.mjs

      # `npm run verify` validates the plugin with the Claude Code CLI.
      - name: install the Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code

      # Native cmd, not bash or WSL, so paths, separators and line endings are
      # the ones a Windows user actually gets.
      - name: npm run verify (Windows, native cmd)
        if: runner.os == 'Windows'
        shell: cmd
        run: npm run verify

      - name: npm run verify
        if: runner.os != 'Windows'
        shell: bash
        run: npm run verify
