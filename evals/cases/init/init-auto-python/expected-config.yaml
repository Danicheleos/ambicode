schemaVersion: 5
id: py-service-tidewatch
context:
  maxTotalTokens: 60000
  maxFileTokens: 2500
  maxIndexTokens: 5000
skills:
  init:
    model: sonnet
    effort: medium
    timeoutMinutes: 15
    scout:
      model: sonnet
      effort: medium
      timeoutMinutes: 15
  review:
    model: sonnet
    effort: medium
    timeoutMinutes: 15
    maxFindings: null
    maxChangedFiles: null
    maxChangedLines: null
    maxContextBytes: null
    excludePaths: []
  task:
    model: sonnet
    effort: medium
    timeoutMinutes: 15
    checkTimeoutSeconds: 120
  plan:
    model: sonnet
    effort: medium
    timeoutMinutes: 15
  investigate:
    model: sonnet
    effort: medium
    timeoutMinutes: 15
  rules:
    model: sonnet
    effort: medium
    timeoutMinutes: 15
requirements:
  runtimes: {}
  mcps: []
  lsps: []
  env: []
projects:
  - id: tidewatch
    root: .
    paths:
      - src/
    ecosystem:
      languages:
        - python
      frameworks: []
      packageManager: uv
    include:
      - src/**
    exclude:
      - tests/**
    ignored: []
    packs:
      - builtin/common-design
      - builtin/common-code
      - builtin/common-errors
      - builtin/common-security
      - builtin/common-verification
      - builtin/common-checks
      - builtin/python-quality
    policyFiles:
      - .ambicode/policies/common/common-design.yaml
      - .ambicode/policies/common/common-code.yaml
      - .ambicode/policies/common/common-errors.yaml
      - .ambicode/policies/common/common-security.yaml
      - .ambicode/policies/common/common-verification.yaml
      - .ambicode/policies/common/common-checks.yaml
      - .ambicode/policies/python/python-quality.yaml
    commands: {}
    checks:
      test:
        all: uv run pytest
        file: uv run pytest {file}
      lint:
        all: uv run ruff check src tests
        file: uv run ruff check {file}
