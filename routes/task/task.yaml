skill: task
version: 3
needsRequest: true
steps:
  - id: fetch
    actor: model
    when: args.hasRequirement
    instruction: file:routes/investigate/fetch.md
  - id: start
    actor: code
    run: task.start                               # may exit iterations-complete
  - id: ground
    actor: code
    run: [requirements.normalize, checks.runnable, checks.baseline]
    produces: [baseline]
  - id: map-seeded
    actor: code
    when: task.seeded
    run: "search.map(context)"                    # a plan brief or an investigation seeds the map
    produces: [map]
  - id: map-request
    actor: code
    when: task.unseeded
    run: "search.map(prompt)"                     # a raw request: context mode greps identifier-like words only, so prose found nothing
    produces: [map]
  - id: rules
    actor: code
    run: ["policy.stage(before-work)", context.list]
    produces: [policy]
  - id: change
    actor: model
    instruction: file:routes/task/change.md
    work: file:routes/task/change-work.md
    payload: [brief, envelope, baseline, map, "policy:before-work", checks.runnable, context.list]
    produces: ["check{green}"]
  - id: format
    actor: code
    run: [checks.format, checks.approved]         # runs once the green check ends change, before the offer, so a skipped review is still formatted; approved checks run after it
  - id: review-offer
    actor: human
    when: iteration.named                         # only an interactive run that names an iteration is offered the review; with none named the one review of the whole change runs unasked, and headless runs none
    gate:
      question: "Run the independent review of this change?"
      options: [run, "skip — verification incomplete"]
      default: "skip — verification incomplete"
      acting: [run]
  - id: checks-offer
    actor: human
    when: checks.offer                         # before the review so a revise never asks it twice (a revise re-opens every step after its target); a headless run is asked nothing: checks.auto runs them at its end
    gate:
      question: "Run the full checks (the whole project, not by file)?"   # the print names the keys
      options: [run, "skip — verification incomplete"]
      default: "skip — verification incomplete"
      acting: [run]
  - id: brief
    actor: code
    when: gate.review-offer.is(run) or iteration.unnamed
    run: [review.pin, "policy.stage(before-work, review)", "search.map(context, review)", script(brief)]
    repeat: 2                                     # review-again revises it: the post-fix change is pinned anew
  - id: review-agent
    actor: model
    when: gate.review-offer.is(run) or iteration.unnamed
    instruction: file:routes/review/agent.md
    work: file:routes/review/agent-work.md
    payload: ["script:brief"]
  - id: review-record
    actor: code
    when: gate.review-offer.is(run) or iteration.unnamed
    run: review.record                            # reads the reviewer's answer file; none is a failed review
    produces: ["review{recorded}"]
  - id: review-run
    actor: code
    when: gate.review-offer.is(run) or iteration.unnamed
    run: review.evaluate
    onFail: revise fix                            # review-findings: the first entry to fix
  - id: fix
    actor: model
    when: revised                                 # entered only by a revise aimed at fix: review findings or an approved key
    instruction: file:routes/task/fix.md
    work: file:routes/task/fix-work.md
    payload: [brief, envelope, "policy:before-work", checks.runnable]
    produces: ["check{green}"]
    repeat: 4                                     # review findings, the end checks' automatic round, then at most two the user asks for (checks-again)
  - id: scope-checks
    actor: code
    when: checks.auto or iteration.named          # a named iteration runs the scoped keys unasked; its full keys wait for checks-offer
    run: checks.scope                             # every runnable key by the files the task changed, once, after the last iteration; red goes back to fix
    onFail: revise fix
  - id: report-step
    actor: code
    run: [review.evaluate, checks.approved, task.verdict, evidence.report]
    onFail: revise fix                            # a fix-round review with findings; bounded by fix's repeat
  - id: write
    actor: model
    instruction: file:routes/task/write.md
    work: file:routes/task/write-work.md          # the implementer writes the report: main's context is the large one
    final: true
    payload: [report]
