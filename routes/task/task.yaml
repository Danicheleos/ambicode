skill: task
version: 3
steps:
  - id: fetch
    actor: model
    when: args.hasRequirement
    instruction: file:routes/investigate/fetch.md
  - id: start
    actor: code
    run: task.start                               # may exit iterations-complete
  - id: draft-ok
    actor: human
    when: plan.isDraft
    gate:
      question: "The plan is a draft nobody accepted. Implement it anyway?"
      options: ["implement anyway", stop]
      default: stop                               # non-acting: --from-draft records it as a preanswer
  - id: ground
    actor: code
    run: [requirements.normalize, checks.preflight, checks.runnable, checks.baseline, "search.map(context)", "policy.stage(before-work)", context.list]
    produces: [baseline, map, policy]
    repeat: 2
  - id: change
    actor: model
    instruction: file:routes/task/change.md
    work: file:routes/task/change-work.md
    payload: [brief, envelope, baseline, map, "policy:before-work", checks.runnable, context.list]
    produces: ["check{green}"]
  - id: format
    actor: code
    run: checks.format                            # runs once the green check ends change, before the offer, so a skipped review is still formatted
  - id: review-offer
    actor: human
    gate:
      question: "Run the independent review of this change?"
      options: [run, "skip — verification incomplete"]
      default: "skip — verification incomplete"
      acting: [run]
  - id: brief
    actor: code
    when: gate.review-offer.is(run)
    run: [review.pin, "policy.stage(before-work, review)", script(brief)]
    repeat: 2                                     # review-again revises it: the post-fix change is pinned anew
  - id: review-agent
    actor: model
    when: gate.review-offer.is(run)
    instruction: file:routes/review/agent.md
    payload: ["script:brief"]
    produces: ["review{recorded}"]
  - id: review-run
    actor: code
    when: gate.review-offer.is(run)
    run: review.evaluate
    onFail: revise fix                            # review-findings: the first entry to fix
  - id: fix
    actor: model
    when: revised                                 # entered only by a revise aimed at fix: review findings or an approved key
    instruction: file:routes/task/fix.md
    work: file:routes/task/fix-work.md
    payload: [brief, envelope, "policy:before-work", checks.runnable]
    produces: ["check{green}"]
    repeat: 2
  - id: report-step
    actor: code
    run: [review.evaluate, task.report, task.iterations]
    onFail: revise fix                            # a fix-round review with findings; bounded by fix's repeat
  - id: write
    actor: model
    instruction: file:routes/task/write.md
    final: true
    payload: [report, iterations]
