skill: rules
version: 3
exits: [done, blocked, human, inconclusive, superseded]
steps:
  - id: discover
    actor: code
    run: ["script(discover)"]
  - id: sources
    actor: human
    gate:
      question: "Which written rules should become policy packs? Name the files in your own words, or use the sources listed."
      options: ["use these sources", "none — stop"]
      default: "none — stop"
      release: "none — stop"
      onAnswer: { "*": "revise discover --source $answer" }
  - id: context
    actor: code
    run: ["script(context)"]
    onError: stop:human
  - id: draft
    actor: model
    instruction: "file:routes/rules/draft.md"
    payload: ["script:discover", "script:context"]
    produces: ["policy{drafts}"]
    repeat: 3
  - id: rules-table
    actor: human
    gate:
      question: "Make these drafts live policy packs?"
      object: "policy{drafts}"
      options: ["Apply all", "Apply with changes", "Discard drafts"]
      default: "Discard drafts"
      release: "Discard drafts"
      acting: ["Apply all"]
      onAnswer: { "Apply with changes": "revise draft", "*": "revise draft --change $answer" }
      maxRevises: 3
  - id: apply
    actor: model
    when: gate.rules-table.is(Apply all)
    instruction: "file:routes/rules/apply-run.md"
    produces: ["policy{apply}"]
