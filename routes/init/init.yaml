skill: init
version: 3
steps:
  - id: scan
    actor: code
    run: ["script(scan)"]
    onError: "stop:blocked"
  - id: detect
    actor: model
    instruction: "file:routes/init/detect.md"
    payload: ["script:scan", init.propose]
    repeat: 3
  - id: propose
    actor: code
    run: [init.propose]
    onFail: revise detect
  - id: init-apply
    actor: human
    gate:
      question: "Write this configuration?"
      options: ["Apply", "Adjust", "Cancel"]
      acting: ["Apply"]
      default: "Cancel"
      onAnswer: { "Adjust": "revise detect", "*": "revise detect --change $answer" }
      repeat: 20
  - id: apply
    actor: model
    when: gate.init-apply.is(Apply)
    instruction: "file:routes/init/apply-run.md"
  - id: close
    actor: code
    run: [init.close]
